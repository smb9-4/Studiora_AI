<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Studiora AI - Professor Login</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
  <link rel="stylesheet" href="{{ url_for('static', filename='auth.css') }}" />
  <link rel="icon" type="image/png" href="{{ url_for('static', filename='logo.png') }}" />
  <style>
    .auth-options { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem; font-size: 0.8125rem; }
    .auth-remember { display: flex; align-items: center; gap: 0.5rem; color: rgba(255,255,255,0.4); cursor: pointer; }
    .auth-remember input { width: auto; accent-color: #8b5cf6; }
    .auth-forgot { color: #8b5cf6; text-decoration: none; transition: color 0.3s; }
    .auth-forgot:hover { color: #00d4ff; }
    .role-badge { display: flex; align-items: center; justify-content: center; gap: 0.5rem; padding: 0.5rem 1rem; border-radius: 999px; background: rgba(139,92,246,0.1); border: 1px solid rgba(139,92,246,0.2); color: #8b5cf6; font-size: 0.875rem; margin-bottom: 2rem; }
    .auth-secondary-btn {
      width: 100%;
      display: inline-flex;
      justify-content: center;
      align-items: center;
      padding: 0.95rem 1rem;
      margin-top: 0.75rem;
      border-radius: 0.9rem;
      background: linear-gradient(135deg, #7c3aed, #9333ea);
      color: #ffffff;
      border: 1px solid rgba(255,255,255,0.16);
      font-weight: 600;
      text-decoration: none;
      box-shadow: 0 12px 30px rgba(124, 58, 237, 0.12);
      transition: transform 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;
      pointer-events: none; /* container not clickable; inner link will be */
    }
    .auth-secondary-btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 16px 40px rgba(124, 58, 237, 0.18);
      background: linear-gradient(135deg, #8b5cf6, #a855f7);
    }
    .auth-secondary-btn a {
      pointer-events: auto; /* only the text link is clickable */
      color: inherit;
      text-decoration: none;
      display: inline-block;
      padding: 0.15rem 0.5rem; /* small hit area around the text */
    }
  </style>
</head>
<body class="auth-body">

<!-- Noise Overlay -->
<div class="noise-overlay"></div>

<!-- Scroll Progress -->
<div id="scroll-progress" class="scroll-progress"></div>

<!-- Cursor Glow -->
<div id="cursor-glow" class="cursor-glow"></div>

<!-- Canvas Effects -->
<canvas id="aurora-canvas" class="fixed-canvas"></canvas>
<canvas id="mouse-trail" class="fixed-canvas" style="z-index:9996"></canvas>
<canvas id="particles-canvas" class="fixed-canvas" style="z-index:0; opacity:0.6"></canvas>

<div class="auth-container">
  <div class="auth-card">
    <a href="{{ url_for('landing') }}" class="auth-logo">
      <img src="{{ url_for('static', filename='logo.png') }}" alt="Studiora AI Logo" class="auth-logo-img" />
    </a>

    <div class="role-badge">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1 0-5H20"/></svg>
      <span>Professor Login</span>
    </div>

    <form id="auth-form" class="auth-form" onsubmit="return handleAuth(event)">
      <input type="hidden" name="role" value="professor" />

      <div class="form-group">
        <label for="email">Professor Email</label>
        <input type="email" id="email" name="email" placeholder="Enter your email" autocomplete="email" />
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" placeholder="Enter your password" autocomplete="current-password" />
      </div>

      <div class="auth-options">
        <label class="auth-remember">
          <input type="checkbox" /> Remember Me
        </label>
        <a href="#" class="auth-forgot">Forgot Password?</a>
      </div>

      <p id="auth-error" class="auth-error hidden"></p>

      <button type="submit" id="auth-submit" class="auth-submit">Login</button>
      <p class="auth-switch" style="margin-top:1.25rem;text-align:center;">
        <span>Don't have an account?</span>
        <a href="{{ url_for('professor_signup') }}">Create an account</a>
      </p>
    </form>

    <p class="auth-switch">
      <span>Are you a student?</span>
      <a href="{{ url_for('student_login') }}">Student Login</a>
    </p>

    <a href="{{ url_for('landing') }}" class="auth-back">&larr; Back to Home</a>
  </div>
</div>

<div class="noise-overlay"></div>

<script>
async function handleAuth(e) {
  e.preventDefault();
  const error = document.getElementById('auth-error');
  error.classList.add('hidden');

  const form = document.getElementById('auth-form');
  const formData = new FormData(form);

  if (!formData.get('email').trim() || !formData.get('password').trim()) {
    error.textContent = 'Email and password are required.';
    error.classList.remove('hidden');
    return false;
  }

  const btn = document.getElementById('auth-submit');
  btn.disabled = true;
  btn.textContent = 'Please wait...';

  try {
    const res = await fetch('{{ url_for("api_login") }}', { method: 'POST', body: formData });
    const data = await res.json();

    if (!res.ok) {
      error.textContent = data.error || 'Invalid email or password.';
      error.classList.remove('hidden');
      btn.disabled = false;
      btn.textContent = 'Login';
      return false;
    }

    window.location.href = data.redirect;
  } catch (err) {
    error.textContent = 'Network error. Please try again.';
    error.classList.remove('hidden');
  }

  btn.disabled = false;
  btn.textContent = 'Login';
  return false;
}
</script>
<script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
